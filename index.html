<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090605" />
  <meta name="description" content="An immersive interactive samurai world." />
  <title>RONIN — The Crimson Path</title>
  <style>
    :root {
      --ink:#090605;
      --paper:#efe5d3;
      --blood:#c1261d;
      --ember:#ff6b31;
      --glass:rgba(15,9,7,.48);
      --edge:rgba(255,235,215,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}
    .site{position:relative;width:100%;height:100%;isolation:isolate;background:#080505;overflow:hidden;touch-action:none}
    .world{position:absolute;inset:-3%;overflow:hidden;transform:scale(1.04);transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .7s ease}
    .world.is-awake{transform:scale(1.075);filter:saturate(1.16) contrast(1.04)}
    .hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 54%;transform:translate3d(var(--px,0),var(--py,0),0) scale(1.045);transition:filter .7s ease;filter:saturate(.92) contrast(1.04) brightness(.84)}
    .world.is-awake .hero-video{filter:saturate(1.12) contrast(1.08) brightness(.92)}
    .veil{position:absolute;inset:0;pointer-events:none;background:
      radial-gradient(circle at 50% 58%,transparent 22%,rgba(4,2,2,.18) 60%,rgba(4,2,2,.78) 100%),
      linear-gradient(180deg,rgba(4,2,2,.38),transparent 24%,transparent 65%,rgba(4,2,2,.72));
      mix-blend-mode:multiply}
    .grain{position:absolute;inset:-50%;opacity:.13;pointer-events:none;animation:grain .22s steps(2) infinite;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
    @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(1%,2%)}100%{transform:translate(-3%,-1%)}}

    .hud{position:absolute;inset:0;z-index:8;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));opacity:0;transform:translateY(12px);transition:opacity .9s ease .25s,transform .9s ease .25s}
    .site.entered .hud{opacity:1;transform:none}
    .topbar,.bottombar{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:11px;letter-spacing:.3em;text-transform:uppercase;font-size:11px;font-weight:700;text-shadow:0 2px 20px #000}
    .brand-mark{width:1px;height:32px;background:linear-gradient(var(--paper),transparent)}
    .chapter{font-family:Georgia,serif;font-size:12px;font-style:italic;letter-spacing:.08em;color:rgba(255,244,232,.78)}
    .controls{display:flex;gap:8px;pointer-events:auto}
    .icon-btn{border:1px solid var(--edge);background:var(--glass);color:var(--paper);width:43px;height:43px;border-radius:999px;display:grid;place-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:.25s ease}
    .icon-btn:hover,.icon-btn:focus-visible{background:rgba(193,38,29,.35);border-color:rgba(255,180,145,.45);transform:translateY(-2px)}
    .icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .prompt{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,239,222,.72);text-shadow:0 2px 16px #000}
    .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 18px var(--ember);animation:pulse 1.6s ease infinite}
    @keyframes pulse{50%{transform:scale(1.7);opacity:.45}}
    .seal{border:1px solid rgba(255,229,206,.25);background:rgba(40,11,8,.45);backdrop-filter:blur(10px);color:rgba(255,235,214,.9);font-family:Georgia,serif;padding:9px 12px;border-radius:2px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}

    .samurai-hotspot{position:absolute;z-index:7;left:50%;top:63%;width:min(36vw,330px);height:min(42vh,460px);transform:translate(-50%,-50%);border:0;background:transparent;cursor:crosshair;pointer-events:none;outline:none;border-radius:50%}
    .site.entered .samurai-hotspot{pointer-events:auto}
    .samurai-hotspot::before{content:"";position:absolute;inset:15%;border:1px solid rgba(255,115,75,0);border-radius:50%;transition:.35s ease;box-shadow:0 0 0 rgba(255,90,46,0)}
    .samurai-hotspot:hover::before,.samurai-hotspot:focus-visible::before{border-color:rgba(255,130,89,.35);box-shadow:0 0 50px rgba(200,35,24,.2)}
    .samurai-hotspot span{position:absolute;left:50%;bottom:4%;transform:translate(-50%,10px);opacity:0;white-space:nowrap;color:#fff0e4;font-size:10px;letter-spacing:.26em;text-transform:uppercase;text-shadow:0 3px 14px #000;transition:.3s ease}
    .samurai-hotspot:hover span,.samurai-hotspot:focus-visible span{opacity:.82;transform:translate(-50%,0)}

    .intro{position:absolute;inset:0;z-index:30;background:#060404;display:grid;place-items:center;overflow:hidden;transition:opacity 1s ease,visibility 1s ease}
    .site.entered .intro{opacity:0;visibility:hidden;pointer-events:none}
    .intro-bg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,4,4,.98),rgba(6,4,4,.46) 50%,rgba(6,4,4,.95)),url('assets/samurai-poster.jpg') center 54%/cover no-repeat;filter:grayscale(.65) brightness(.42) contrast(1.2);transform:scale(1.06);animation:introDrift 8s ease-in-out infinite alternate}
    @keyframes introDrift{to{transform:scale(1.11) translateY(-1%)}}
    .intro::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0 18%,rgba(5,3,3,.74) 72%)}
    .intro-content{position:relative;z-index:2;text-align:center;padding:24px;max-width:690px}
    .kanji{font-family:Georgia,serif;font-size:clamp(13px,1.8vw,18px);letter-spacing:.9em;color:rgba(238,202,177,.64);margin:0 0 22px .9em}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(62px,13vw,160px);line-height:.82;letter-spacing:.04em;margin:0;text-shadow:0 8px 40px #000}
    .sub{margin:20px 0 30px;font-family:Georgia,serif;font-size:clamp(14px,2.2vw,18px);font-style:italic;letter-spacing:.14em;color:rgba(255,236,218,.78)}
    .enter-btn{position:relative;border:1px solid rgba(255,223,202,.28);color:#fff3e7;background:rgba(104,20,14,.2);padding:15px 29px;border-radius:999px;text-transform:uppercase;letter-spacing:.28em;font-size:11px;cursor:pointer;overflow:hidden;backdrop-filter:blur(10px);transition:.25s ease}
    .enter-btn:hover,.enter-btn:focus-visible{transform:translateY(-2px);border-color:rgba(255,169,124,.6);background:rgba(153,30,20,.35);box-shadow:0 12px 45px rgba(170,31,21,.18)}
    .enter-btn::after{content:"";position:absolute;left:-45%;top:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);transform:skewX(-22deg);animation:shimmer 2.8s ease infinite}
    @keyframes shimmer{0%,45%{left:-45%}75%,100%{left:120%}}
    .sound-note{margin-top:15px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,235,220,.48)}

    .slash{position:absolute;z-index:60;left:50%;top:50%;width:145vw;height:3px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) rotate(-19deg) scaleX(0);transform-origin:center;background:linear-gradient(90deg,transparent 8%,#fff 43%,#fff 57%,transparent 92%);box-shadow:0 0 14px #fff,0 0 42px #ff3c1f,0 0 90px rgba(255,42,20,.75)}
    .slash.fire{animation:slash .72s cubic-bezier(.16,.82,.18,1)}
    @keyframes slash{0%{opacity:0;transform:translate(-50%,-50%) rotate(-19deg) scaleX(0)}22%{opacity:1;transform:translate(-50%,-50%) rotate(-19deg) scaleX(1)}50%{opacity:.92;height:7px}100%{opacity:0;transform:translate(-50%,-50%) rotate(-19deg) scaleX(1.08)}}
    .flash{position:absolute;inset:0;z-index:55;background:white;pointer-events:none;opacity:0;mix-blend-mode:screen}
    .flash.fire{animation:flash .55s ease}
    @keyframes flash{0%{opacity:0}18%{opacity:.75}100%{opacity:0}}
    .ink-panels{position:absolute;inset:0;z-index:50;pointer-events:none;display:flex}
    .ink-panels i{flex:1;background:#050303;transform-origin:center;transition:transform 1.05s cubic-bezier(.72,0,.18,1)}
    .site.entered .ink-panels i:first-child{transform:translateX(-102%)}
    .site.entered .ink-panels i:last-child{transform:translateX(102%)}

    .particles{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
    .particle{position:absolute;width:4px;height:11px;border-radius:80% 0 80% 0;background:radial-gradient(circle at 30% 30%,#ffd1a8,var(--ember) 55%,rgba(140,20,13,.1));box-shadow:0 0 10px rgba(255,85,36,.65);animation:fly var(--d,1.4s) ease-out forwards;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
    @keyframes fly{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--r) + 220deg));opacity:0}}
    .ring{position:absolute;z-index:5;left:50%;top:63%;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,116,74,.8);transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none}
    .ring.fire{animation:ring 1s ease-out}
    @keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(11)}}

    .toast{position:absolute;z-index:20;left:50%;bottom:92px;transform:translate(-50%,15px);padding:10px 14px;border-radius:999px;background:rgba(12,6,5,.56);border:1px solid var(--edge);backdrop-filter:blur(12px);font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:0;pointer-events:none;transition:.35s ease;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media (max-width:640px){
      .hero-video{object-position:center 52%}
      .chapter{display:none}
      .brand{letter-spacing:.22em}
      .prompt{font-size:9px;letter-spacing:.14em}
      .seal{display:none}
      .samurai-hotspot{top:66%;width:58vw;height:42vh}
      .toast{bottom:84px;max-width:88vw;white-space:normal;text-align:center}
    }
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.grain{display:none}}
  </style>
</head>
<body>
  <main class="site" id="site">
    <section class="world" id="world" aria-label="Interactive samurai landscape">
      <video id="heroVideo" class="hero-video" poster="assets/samurai-poster.jpg" playsinline loop preload="auto">
        <source src="assets/samurai-hero.mp4" type="video/mp4" />
      </video>
      <div class="veil"></div>
      <div class="grain"></div>
    </section>

    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="ring" id="ring" aria-hidden="true"></div>

    <button class="samurai-hotspot" id="samurai" aria-label="Touch the samurai">
      <span>Awaken the ronin</span>
    </button>

    <div class="hud">
      <div class="topbar">
        <div class="brand"><span class="brand-mark"></span><span>Crimson Path</span></div>
        <div class="chapter">Chapter I · The Awakening</div>
        <div class="controls">
          <button class="icon-btn" id="soundBtn" aria-label="Mute sound" title="Sound">
            <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="waves" d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>
          </button>
          <button class="icon-btn" id="replayBtn" aria-label="Replay sword intro" title="Replay intro">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>
      <div class="bottombar">
        <div class="prompt"><span class="pulse-dot"></span><span>Touch the warrior · Drag across the world</span></div>
        <div class="seal">Ronin / 浪人</div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">The ronin is awake</div>

    <section class="intro" id="intro" aria-label="Enter the experience">
      <div class="intro-bg"></div>
      <div class="intro-content">
        <p class="kanji">侍 · 浪人 · 道</p>
        <h1>RONIN</h1>
        <p class="sub">The crimson path remembers every step.</p>
        <button class="enter-btn" id="enterBtn">Draw the blade</button>
        <p class="sound-note">Enter with sound</p>
      </div>
    </section>

    <div class="ink-panels" aria-hidden="true"><i></i><i></i></div>
    <div class="slash" id="slash" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
  </main>

  <script>
    const site = document.getElementById('site');
    const world = document.getElementById('world');
    const video = document.getElementById('heroVideo');
    const enterBtn = document.getElementById('enterBtn');
    const soundBtn = document.getElementById('soundBtn');
    const replayBtn = document.getElementById('replayBtn');
    const samurai = document.getElementById('samurai');
    const particles = document.getElementById('particles');
    const slash = document.getElementById('slash');
    const flash = document.getElementById('flash');
    const ring = document.getElementById('ring');
    const toast = document.getElementById('toast');
    let audioCtx;
    let entered = false;
    let dragging = false;
    let lastSlashAt = 0;
    let toastTimer;

    function swordSound(intensity = 1) {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * .55, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          const t = i / data.length;
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 5) * (0.9 + Math.sin(i * .035) * .1);
        }
        const src = audioCtx.createBufferSource();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(3200, now);
        filter.frequency.exponentialRampToValueAtTime(700, now + .35);
        filter.Q.value = .7;
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.42 * intensity, now + .018);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .48);
        src.connect(filter).connect(gain).connect(audioCtx.destination);
        src.start(now);
      } catch (e) {}
    }

    function animateClass(el, cls, duration = 850) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
      setTimeout(() => el.classList.remove(cls), duration);
    }

    function fireSlash(intensity = 1) {
      animateClass(slash, 'fire', 800);
      animateClass(flash, 'fire', 650);
      swordSound(intensity);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    async function enterExperience() {
      if (entered) return;
      entered = true;
      fireSlash(1);
      setTimeout(async () => {
        site.classList.add('entered');
        video.muted = false;
        video.volume = 1;
        try { await video.play(); } catch (e) {
          video.muted = true;
          await video.play().catch(() => {});
          showToast('Tap sound to enable audio');
        }
      }, 270);
    }

    function burst(x, y, count = 14) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('i');
        p.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const distance = 45 + Math.random() * 130;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--x', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--y', Math.sin(angle) * distance + 'px');
        p.style.setProperty('--r', Math.random() * 180 + 'deg');
        p.style.setProperty('--d', (.75 + Math.random() * .9) + 's');
        particles.appendChild(p);
        setTimeout(() => p.remove(), 1800);
      }
    }

    function awaken(e) {
      e.stopPropagation();
      world.classList.add('is-awake');
      animateClass(ring, 'fire', 1100);
      fireSlash(.75);
      const rect = site.getBoundingClientRect();
      burst(rect.width * .5, rect.height * .63, 24);
      showToast('The ronin is awake');
      setTimeout(() => world.classList.remove('is-awake'), 1200);
    }

    function updateParallax(clientX, clientY) {
      const x = (clientX / innerWidth - .5) * -18;
      const y = (clientY / innerHeight - .5) * -12;
      video.style.setProperty('--px', x + 'px');
      video.style.setProperty('--py', y + 'px');
    }

    enterBtn.addEventListener('click', enterExperience);
    samurai.addEventListener('click', awaken);

    soundBtn.addEventListener('click', async () => {
      video.muted = !video.muted;
      if (!video.muted) {
        try { await video.play(); } catch (e) {}
        showToast('Sound on');
      } else showToast('Sound muted');
      soundBtn.setAttribute('aria-label', video.muted ? 'Enable sound' : 'Mute sound');
      soundBtn.querySelector('.waves').style.display = video.muted ? 'none' : '';
    });

    replayBtn.addEventListener('click', () => {
      fireSlash(1);
      burst(innerWidth * .5, innerHeight * .5, 20);
      video.currentTime = 0;
      video.play().catch(() => {});
      showToast('The path begins again');
    });

    site.addEventListener('pointerdown', e => {
      if (!entered || e.target.closest('button')) return;
      dragging = true;
      site.setPointerCapture?.(e.pointerId);
      burst(e.clientX, e.clientY, 8);
    });
    site.addEventListener('pointermove', e => {
      if (!entered) return;
      updateParallax(e.clientX, e.clientY);
      if (dragging && performance.now() - lastSlashAt > 180) {
        lastSlashAt = performance.now();
        const spark = document.createElement('i');
        spark.className = 'particle';
        spark.style.left = e.clientX + 'px';
        spark.style.top = e.clientY + 'px';
        spark.style.setProperty('--x', (Math.random()*40-20)+'px');
        spark.style.setProperty('--y', (-30-Math.random()*60)+'px');
        spark.style.setProperty('--d', '.7s');
        particles.appendChild(spark);
        setTimeout(() => spark.remove(), 900);
      }
    });
    site.addEventListener('pointerup', e => {
      if (!entered || !dragging) return;
      dragging = false;
      if (performance.now() - lastSlashAt < 260) {
        fireSlash(.45);
        burst(e.clientX, e.clientY, 12);
      }
    });
    site.addEventListener('pointercancel', () => dragging = false);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) video.pause();
      else if (entered) video.play().catch(() => {});
    });
  </script>
</body>
</html>
